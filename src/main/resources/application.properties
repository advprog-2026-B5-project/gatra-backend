spring.application.name=gatra
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

app.frontend.url=http://localhost:5173/
app.backend.url=http://localhost:8080/

# OBSERVABILITY & MONITORING
# Only expose health and prometheus endpoints
management.endpoints.web.exposure.include=health,prometheus,metrics

# Always show database and disk health details
management.endpoint.health.show-details=always

# Tag all metrics from this module automatically
management.metrics.tags.application=gatra-auth