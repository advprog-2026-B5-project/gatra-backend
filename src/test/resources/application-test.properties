spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=IniAdalahSecretKeyDummyYangCukupPanjangUntukTestingSaja
jwt.expiration=86400000

# Nilai ini sepenuhnya bohongan, hanya agar Spring Security berhasil membuat ClientRegistrationRepository
spring.security.oauth2.client.registration.google.client-id=mock-google-client-id-untuk-testing
spring.security.oauth2.client.registration.google.client-secret=mock-google-client-secret-untuk-testing

# Nilai ini bebas karena hanya untuk memuaskan Spring saat booting di lingkungan test
app.frontend.url=http://localhost:3000