# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - gatra-api-prod

permissions: read-all

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Java version
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test
          rm build/libs/*-plain.jar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: java-app
          path: '${{ github.workspace }}/build/libs/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1808D8433B7B487DBF515DF41B65B93B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9ACCCB41514F44FFA5E23C92837365CF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_72307C72751C46E6BA7826CCFD328064 }}

      # Step 1: Deploy to Staging (Green)
      - name: Deploy to Azure Web App (Staging Slot)
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: 'gatra-api-prod'
          slot-name: 'staging'
          package: '*.jar'

      # Step 2: Initiate Swap with Preview
      - name: Start Swap with Preview
        run: |
          az webapp deployment slot swap --name gatra-api-prod \
          --resource-group gatra-backend-rg \
          --slot staging \
          --target-slot production \
          --action preview